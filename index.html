<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba Azure + SQLite</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; background: #f8fafc; }
    .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    h1 { color: #0078d4; margin-top: 0; }
    button { background: #0078d4; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-size: 15px; cursor: pointer; }
    button:hover { background: #005a9e; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e2e8f0; }
    th { background: #f1f5f9; color: #475569; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Laboratorio Azure: Python + SQLite</h1>
    <p>Esta página web estática consulta una API en Python que ejecuta sentencias SQL en SQLite.</p>
    <button onclick="cargarDatos()">Consultar Base de Datos</button>

    <div id="resultado"></div>
  </div>

  <script>
    async function cargarDatos() {
      const contenedor = document.getElementById('resultado');
      contenedor.innerHTML = '<p>Consultando SQLite en Azure...</p>';

      try {
        const respuesta = await fetch('/api/socios');
        const datos = await respuesta.json();

        let html = '<table><thead><tr><th>ID</th><th>Nombre</th><th>Rol</th><th>Aportación</th></tr></thead><tbody>';
        datos.forEach(fila => {
          html += `<tr><td>${fila.id}</td><td>${fila.nombre}</td><td>${fila.rol}</td><td>${fila.aportacion}€</td></tr>`;
        });
        html += '</tbody></table>';
        contenedor.innerHTML = html;
      } catch (error) {
        contenedor.innerHTML = '<p style="color:red;">Error al consultar la API.</p>';
      }
    }
  </script>
</body>
</html>
